apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-demo
  namespace: qa-demo
  labels:
    app: qa-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qa-demo
  template:
    metadata:
      labels:
        app: qa-demo
    spec:
      containers:
        - name: qa-demo
          image: k8s-qa-demo:local
          # Image is loaded into Kind with `kind load docker-image`, not pulled
          # from a registry — IfNotPresent stops K8s trying (and failing) to pull.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qa-demo-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
