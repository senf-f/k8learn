name: k8s-tests

# Build the image, spin up a Kind cluster, deploy, and run the full pytest
# suite (unit + integration) against the deployed app on every push/PR to main.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  k8s-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v5

      # Docker and kubectl are preinstalled on ubuntu-latest runners.
      # setup-cluster.sh is the single source of truth for cluster bring-up:
      # it builds the image, creates the Kind cluster, loads the image, applies
      # the manifests, and waits for the rollout. The node-image pin exists for
      # a local cgroup v1 host; it also runs fine on the runner's cgroup v2.
      - name: Create cluster and deploy
        run: bash scripts/setup-cluster.sh

      - name: Install test dependencies
        run: pip install -r app/requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --html=report.html --self-contained-html

      # Upload the HTML report even when tests fail — that's when it's most
      # useful. `if: always()` runs regardless of the previous step's outcome.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: report.html

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "==> Pods"
          kubectl get pods -n qa-demo -o wide || true
          echo "==> Deployment"
          kubectl describe deployment qa-demo -n qa-demo || true
          echo "==> Pod logs"
          kubectl logs -n qa-demo -l app=qa-demo --all-containers --tail=200 || true
          echo "==> Events"
          kubectl get events -n qa-demo --sort-by=.lastTimestamp || true
